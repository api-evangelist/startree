aid: startree
name: StarTree
description: >-
  StarTree is a real-time analytics platform built on Apache Pinot, the open-source
  OLAP database for user-facing and agent-facing analytics. StarTree Cloud is the
  fully managed, enterprise-grade service — sub-second queries at high concurrency,
  streaming and batch ingestion up to millions of events per second, scalable
  upserts, in-place queries on Apache Iceberg tables, and ThirdEye anomaly
  detection. It ships enterprise security (RBAC, SSO, encryption, SOC 2 / ISO 27001
  / HIPAA) with SaaS, BYOC, and BYOK deployment options, and exposes Controller,
  Broker, and Query REST APIs plus an official MCP server for agents.
